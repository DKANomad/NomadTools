name: Windows Release
run-name: Windows release build for ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Prepare build metadata
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - name: Validate release tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          reference="${GITHUB_SHA:0:9}"
          publish=false

          if [[ "${GITHUB_EVENT_NAME}" == 'push' ]]; then
            tag_pattern='^v[0-9]+\.[0-9]+(\.[0-9]+)?(-(beta|rc)[0-9]+)?$'
            if [[ ! "${GITHUB_REF_NAME}" =~ ${tag_pattern} ]]; then
              echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi

            reference="${GITHUB_REF_NAME}"
            publish=true
          fi

          {
            echo "artifact_name=nomad-tools-${reference}-windows-x64"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build Windows release
    needs: metadata
    uses: ./.github/workflows/_build-with-obs.yml
    permissions:
      contents: read
    with:
      # Keep this pinned so each plugin tag records a reproducible OBS target.
      obs_ref: '32.2.2'
      configuration: Release
      package: true
      artifact_name: ${{ needs.metadata.outputs.artifact_name }}

  publish:
    name: Publish GitHub release
    if: needs.metadata.outputs.publish == 'true'
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}
          path: release-artifacts

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(release-artifacts/*)
          if (( ${#assets[@]} == 0 )); then
            echo 'No release assets were downloaded.' >&2
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            exit 0
          fi

          release_args=(
            --verify-tag
            --generate-notes
            --title "NomadTools ${GITHUB_REF_NAME}"
          )
          if [[ "${GITHUB_REF_NAME}" =~ -(beta|rc)[0-9]+$ ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" "${release_args[@]}" "${assets[@]}"
